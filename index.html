<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Residencia Cirurgia Geral</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=DM+Mono:wght@400;500&family=Figtree:wght@300;400;500;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="header">
      <div>
        <h1>&#127973; Cirurgia Geral</h1>
        <p>Residencia Medica &middot; 1 topico por dia &middot; ~1h</p>
      </div>
      <div class="global-wrap">
        <div id="cloud-status">
          <span id="cloud-icon" style="color: #7c9ef8;">☁️</span>
          <span id="cloud-text">Nuvem ativa</span>
        </div>
        <div class="global-pct">
          <span id="gpct-num" style="font-size: 1rem; color: #7c9ef8">0%</span>
          <span>concluido</span>
        </div>
        <svg width="40" height="40" viewBox="0 0 40 40">
          <circle
            cx="20"
            cy="20"
            r="16"
            fill="none"
            stroke="rgba(255,255,255,0.07)"
            stroke-width="3"
          />
          <circle
            id="g-ring"
            cx="20"
            cy="20"
            r="16"
            fill="none"
            stroke="#7c9ef8"
            stroke-width="3"
            stroke-linecap="round"
            stroke-dasharray="100.5"
            stroke-dashoffset="100.5"
            transform="rotate(-90 20 20)"
            style="transition: stroke-dashoffset 0.5s ease"
          />
        </svg>
      </div>
    </div>
    <div class="nav-tabs" id="nav-tabs"></div>
    <div class="content" id="content-area"></div>
    <script src="app.js" defer></script>
  </body>
</html>
